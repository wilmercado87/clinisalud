services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinisalud}
      POSTGRES_USER: ${POSTGRES_USER:-clinisalud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinisalud}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinisalud} -d ${POSTGRES_DB:-clinisalud}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: ghcr.io/wilmercado87/clinisalud-backend:${VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-clinisalud}:${POSTGRES_PASSWORD:-clinisalud}@db:5432/${POSTGRES_DB:-clinisalud}
      DB_SYNC: ${DB_SYNC:-normal}
      JWT_SECRET: ${JWT_SECRET:-clinisalud_secret_key_2026}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: frontend
    image: ghcr.io/wilmercado87/clinisalud-frontend:${VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata: