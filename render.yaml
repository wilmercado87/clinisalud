services:
  - type: web
    name: clinisalud-api
    runtime: docker
    repo: https://github.com/wilmercado87/clinisalud
    rootDir: backend
    dockerfilePath: Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_SYNC
        value: normal
      - key: CORS_ORIGIN
        value: https://clinisalud-frontend.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
    healthCheckPath: /health

  - type: web
    name: clinisalud-frontend
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build -- --configuration production
    staticPublishPath: ./dist/frontend/browser
    pullRequestPreviewsEnabled: true
    rootDir: frontend