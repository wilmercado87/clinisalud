<mat-form-field appearance="outline" class="catalog-select__field">
  @if (label()) {
    <mat-label>{{ label() }}</mat-label>
  }

  <input
    matInput
    [formControl]="inputControl"
    [errorStateMatcher]="errorMatcher"
    [placeholder]="placeholder()"
    [required]="isRequired()"
    [matAutocomplete]="auto"
    (input)="onInput($event)"
    (mousedown)="onOpenPanel()"
    (blur)="onBlur()"
  />
  <mat-autocomplete #auto="matAutocomplete" (optionSelected)="onOptionSelected($event.option)">
    @if (isLoading()) {
      <mat-option disabled>
        <mat-spinner diameter="20" />
      </mat-option>
    } @else {
      @for (item of filteredItems(); track item.id) {
        <mat-option [value]="item.id">{{ item.description }}</mat-option>
      }
      @if (filteredItems().length === 0) {
        <mat-option disabled>Sin resultados</mat-option>
      }
    }
  </mat-autocomplete>

  @if (value() !== null && !disabled()) {
    <button matSuffix mat-icon-button type="button" (click)="onClear()">
      <mat-icon>close</mat-icon>
    </button>
  }

  @if (resolvedErrorMessage(); as message) {
    <mat-error>{{ message }}</mat-error>
  }
</mat-form-field>
