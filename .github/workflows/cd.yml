name: CD - Deploy controlado

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag version (ej. v1.0.0)"
        required: true
        type: string

env:
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/clinisalud-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/clinisalud-frontend

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_BACKEND }}:${{ inputs.version }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_FRONTEND }}:${{ inputs.version }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/clinisalud
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export VERSION=${{ inputs.version }}
            docker compose pull
            docker compose up -d
            sleep 15
            if curl -fsS http://localhost/health >/dev/null; then
              echo "✅ Deploy OK (${{ inputs.version }})"
            else
              echo "❌ Healthcheck fallo - revisar: docker compose logs backend"; exit 1
            fi